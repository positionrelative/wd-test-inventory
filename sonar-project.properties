sonar.projectKey=wd-test-inventory
sonar.projectName=Inventory API
sonar.sourceEncoding=UTF-8

sonar.sources=app,bootstrap/app.php,config,database,routes
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**

# Generated by `composer test:coverage` in the app container.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.php.tests.reportPath=build/junit.xml

# Configuration and schema code is exercised, but not meaningful for coverage.
sonar.coverage.exclusions=config/**,database/**,routes/**,bootstrap/app.php
